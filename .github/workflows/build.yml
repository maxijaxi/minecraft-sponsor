name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Kompiliert gegen NeoForge 21.1.252, führt die Unit-Tests der Graph-Logik aus und baut die .jar.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Startet ./gradlew runServer in einer frischen, leeren run/-Umgebung und testet den Mod per RCON.
      - name: Smoke test (runServer)
        run: python3 .github/scripts/smoke_test.py

      - name: Upload test reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-logs
          path: |
            build/reports/tests/
            server-phase*.log
            run/logs/
            run/world/sponsor/
            run/whitelist.json
            run/config/sponsor-common.toml
          if-no-files-found: ignore
