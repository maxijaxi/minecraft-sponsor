name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # nur für das Anlegen von Releases bei v*-Tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Kompiliert gegen NeoForge 21.1.252, führt die Unit-Tests der Graph-Logik aus und baut die .jar.
      - name: Build
        run: ./gradlew build --continue --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Startet ./gradlew runServer in einer frischen, leeren run/-Umgebung und testet den Mod per RCON.
      - name: Smoke test (runServer)
        run: python3 .github/scripts/smoke_test.py

      - name: Upload test reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-logs
          path: |
            build/reports/tests/
            server-phase*.log
            run/logs/
            run/world/sponsor/
            run/whitelist.json
            run/config/sponsor-common.toml
          if-no-files-found: ignore

      # Bei einem Tag wie v0.1.0: Release mit der getesteten Jar anlegen (nur wenn alle Schritte davor grün sind).
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu mod_version=${version} in gradle.properties"
            exit 1
          fi
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::Kein Abschnitt '## ${version}' in CHANGELOG.md"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" "build/libs/sponsor-${version}.jar" \
            --title "Sponsor ${version}" --notes-file release-notes.md --prerelease --verify-tag
