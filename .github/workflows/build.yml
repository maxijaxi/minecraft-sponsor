name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Nach erfolgreichem Build ein Release v<mod_version> (aus gradle.properties) anlegen'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # nur zum Anlegen von Releases (siehe letzten Schritt)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Kompiliert gegen NeoForge 21.1.252, führt die Unit-Tests der Graph-Logik aus und baut die .jar.
      - name: Build
        run: ./gradlew build --continue --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Startet ./gradlew runServer in einer frischen, leeren run/-Umgebung und testet den Mod per RCON.
      - name: Smoke test (runServer)
        run: python3 .github/scripts/smoke_test.py

      - name: Upload test reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-logs
          path: |
            build/reports/tests/
            server-phase*.log
            run/logs/
            run/world/sponsor/
            run/whitelist.json
            run/config/sponsor-common.toml
          if-no-files-found: ignore

      # Release anlegen: entweder durch Push eines Tags v<version> oder per "Run workflow" mit release=true.
      # Läuft nur, wenn alle Schritte davor (Build, Unit-Tests, Smoke-Test) grün sind.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu mod_version=${version} in gradle.properties"
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} existiert bereits. Erst mod_version in gradle.properties erhöhen."
            exit 1
          fi
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::Kein Abschnitt '## ${version}' in CHANGELOG.md"; exit 1; }
          gh release create "${tag}" "build/libs/sponsor-${version}.jar" --target "${GITHUB_SHA}" \
            --title "Sponsor ${version}" --notes-file release-notes.md --prerelease
